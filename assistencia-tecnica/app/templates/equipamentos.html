<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Equipamentos - Assistência Técnica</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;margin:0;padding:24px}
        .card{max-width:720px;margin:0 auto;background:#fff;padding:20px;border-radius:8px}
        h1{margin-top:0}
        ul{padding-left:1.2rem}
    </style>
</head>
<body>
    <div class="card">
        <h1>Equipamentos</h1>
        {% if equipamentos %}
        <ul>
        {% for e in equipamentos %}
            <li>{{ e.nome }} - Quantidade: {{ e.quantidade }} - R$ {{ '%.2f'|format(e.valor_unitario) }}</li>
        {% endfor %}
        </ul>
        {% else %}
        <p>Equipamentos registrados (exemplo estático).</p>
        <ul>
            <li>Notebook Dell</li>
            <li>Impressora HP</li>
        </ul>
        {% endif %}
        <p><a href="/">Voltar</a></p>
    </div>
</body>
</html>

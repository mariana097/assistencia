<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Técnicos - Assistência Técnica</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;margin:0;padding:24px}
        .card{max-width:720px;margin:0 auto;background:#fff;padding:20px;border-radius:8px}
        h1{margin-top:0}
        ul{padding-left:1.2rem}
    </style>
</head>
<body>
    <div class="card">
        <h1>Técnicos</h1>
        {% if tecnicos %}
        <ul>
        {% for t in tecnicos %}
            <li>{{ t.nome }}{% if t.especialidade %} - {{ t.especialidade }}{% endif %}</li>
        {% endfor %}
        </ul>
        {% else %}
        <p>Lista de técnicos cadastrados (exemplo estático).</p>
        <ul>
            <li>João Silva</li>
            <li>Maria Souza</li>
        </ul>
        {% endif %}
        <p><a href="/">Voltar</a></p>
    </div>
</body>
</html>
